services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - meditrade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
  # App service is deliberately omitted until the PostgreSQL adapter is fully integrated.
networks:
  internal:
    internal: true
volumes:
  meditrade_pgdata:
secrets:
  postgres_password:
    file: ./secrets/postgres_password
